<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DiakoniaApp — Sistema de Gestão Ministerial</title>
    <meta name="description" content="Sistema completo de gestão eclesiástica: membros, ministérios, agenda, campanhas e muito mais.">
    <meta name="author" content="Diakonia App" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── Ícone ────────────────────────────────────────────────────────
         Não havia <link rel="icon"> nenhum: o navegador caía no
         /favicon.ico por convenção, e aquele arquivo ainda era o ícone
         antigo. Declarado agora, com o SVG primeiro.

         **O SVG é o principal**, e não um extra: ele é nítido em qualquer
         tamanho e em qualquer densidade de tela, e pesa 1,4 KB. O `.ico`
         fica como alternativa para navegador que não entende SVG em
         favicon — daí o `rel="alternate icon"`, que é o que faz os dois
         conviverem sem o navegador baixar os dois. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="48x48" />

    <!-- ── Instalável como app ──────────────────────────────────────────
         O manifest e o registro do service worker são injetados aqui
         automaticamente no build pelo vite-plugin-pwa (ver vite.config.ts)
         — nada a fazer manualmente com eles.

         O que o plugin NÃO injeta sozinho é o suporte específico do iOS: o
         Safari não lê o manifest pra decidir o ícone/tela cheia do atalho,
         só estas tags. apple-touch-icon.png foi gerado em 180×180 a partir
         de public/favicon.svg (sobre fundo #F5F3F0 — o iOS ignora
         transparência e pintaria de preto sem isso). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Diakonia" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#9d6125" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="DiakoniaApp — Sistema de Gestão Ministerial" />
    <meta property="og:description" content="Sistema completo de gestão eclesiástica: membros, ministérios, agenda e campanhas." />
    <meta property="og:image"       content="/favicon.ico" />

    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="DiakoniaApp" />
    <meta name="twitter:description" content="Sistema completo de gestão eclesiástica." />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body class="notranslate" translate="no">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
